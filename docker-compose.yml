services:
  mysql:
    image: mysql:8.4
    container_name: client-mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: clients_db
      MYSQL_USER: payment_user
      MYSQL_PASSWORD: payment_pass
      MYSQL_ROOT_PASSWORD: root_pass

    ports:
      - "3307:3306"

    volumes:
      - client_mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_pass"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  client_mysql_data:
